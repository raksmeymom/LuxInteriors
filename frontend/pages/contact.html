<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Contact — LuxInteriors</title>
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="stylesheet" href="../public/css/animations.css" />
    <link rel="stylesheet" href="../public/css/responsive.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="cursor"></div>
    <div id="cursor-ring"></div>
    <div id="toast"></div>
    <section
      id="contact"
      style="
        padding: calc(var(--nav-h)+4rem) 5vw 5rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6rem;
        align-items: start;
      "
    >
      <div class="contact-info">
        <div class="section-label reveal">Get In Touch</div>
        <h2
          class="reveal reveal-delay-1"
          style="
            font-family: &quot;Cormorant Garamond&quot;, serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 300;
            color: var(--cream);
            margin-bottom: 1rem;
          "
        >
          We'd Love to Hear From You
        </h2>
        <p
          class="reveal reveal-delay-2"
          style="color: var(--muted); margin-bottom: 2.5rem"
        >
          Have a question? Our team is here to help.
        </p>
        <div class="contact-detail reveal reveal-delay-1">
          <div class="contact-icon">📍</div>
          <div class="contact-detail-text">
            <strong>Showroom</strong><span>12 Maison Blanche, Paris 75001</span>
          </div>
        </div>
        <div class="contact-detail reveal reveal-delay-2">
          <div class="contact-icon">✉️</div>
          <div class="contact-detail-text">
            <strong>Email</strong><span>hello@luxinteriors.co</span>
          </div>
        </div>
        <div class="contact-detail reveal reveal-delay-3">
          <div class="contact-icon">📞</div>
          <div class="contact-detail-text">
            <strong>Phone</strong><span>+33 1 23 45 67 89</span>
          </div>
        </div>
      </div>
      <div class="reveal reveal-delay-2">
        <div class="contact-form">
          <div class="form-row">
            <div class="form-group">
              <label>Your Name</label
              ><input type="text" id="f-name" placeholder="Sophie Dubois" />
            </div>
            <div class="form-group">
              <label>Email</label
              ><input
                type="email"
                id="f-email"
                placeholder="sophie@email.com"
              />
            </div>
          </div>
          <div class="form-group">
            <label>Subject</label
            ><input type="text" id="f-subject" placeholder="Product enquiry…" />
          </div>
          <div class="form-group">
            <label>Message</label
            ><textarea
              id="f-message"
              placeholder="Tell us how we can help…"
            ></textarea>
          </div>
          <div id="form-msg" class="form-msg"></div>
          <button
            class="form-submit"
            id="form-submit-btn"
            onclick="submitContact()"
          >
            Send Message
          </button>
        </div>
      </div>
    </section>
    <script src="../public/js/main.js"></script>
    <script src="../public/js/contact.js"></script>
  </body>
</html>
