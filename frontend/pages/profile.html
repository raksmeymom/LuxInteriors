<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>My Account — LuxInteriors</title>
  <meta name="description" content="Manage your LuxInteriors account, orders and profile." />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f0e0c;--bg2:#161410;--bg3:#1e1b17;--card:#1a1714;--gold:#c9a84c;--gold2:#e8c97a;--cream:#f5f0e8;--text:#d4cfc7;--muted:#7a746a;--border:rgba(201,168,76,.2);--radius:14px;--ease:cubic-bezier(.4,0,.2,1);--red:#e07070;--green:#6fcf97;--nav-h:76px}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:"Jost",sans-serif;font-weight:300;line-height:1.7;min-height:100vh}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;border:none;outline:none;cursor:pointer}
    img{display:block;max-width:100%}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
    nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:rgba(13,12,10,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
    .logo{font-family:"Cormorant Garamond",serif;font-size:1.05rem;letter-spacing:.22em;color:var(--cream)}
    .nav-links{display:flex;gap:2rem;align-items:center}
    .nav-links a{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .3s}
    .nav-links a:hover,.nav-links a.active{color:var(--cream)}
    .btn-logout{padding:.48rem 1.2rem;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--muted);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;transition:all .3s}
    .btn-logout:hover{border-color:var(--red);color:var(--red)}

    /* LAYOUT */
    .profile-page{padding-top:calc(var(--nav-h) + 3rem);padding-bottom:5rem}
    .container{max-width:1100px;margin:0 auto;padding:0 5vw}
    .profile-header{margin-bottom:3rem}
    .profile-greeting{font-family:"Cormorant Garamond",serif;font-size:2.4rem;font-weight:300;color:var(--cream);margin-bottom:.25rem}
    .profile-email{color:var(--muted);font-size:.88rem}
    .profile-grid{display:grid;grid-template-columns:240px 1fr;gap:2rem;align-items:start}
    @media(max-width:768px){.profile-grid{grid-template-columns:1fr}}

    /* SIDEBAR */
    .sidebar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:sticky;top:calc(var(--nav-h) + 1.5rem)}
    .sidebar-item{display:flex;align-items:center;gap:.85rem;padding:1rem 1.25rem;color:var(--muted);font-size:.82rem;letter-spacing:.06em;transition:all .25s;cursor:pointer;border-left:2px solid transparent}
    .sidebar-item:hover{color:var(--cream);background:rgba(201,168,76,.05)}
    .sidebar-item.active{color:var(--gold);background:rgba(201,168,76,.07);border-left-color:var(--gold)}
    .sidebar-icon{font-size:1.1rem;width:22px;text-align:center}
    .sidebar-divider{height:1px;background:var(--border);margin:.25rem 0}

    /* TABS */
    .tab-content{display:none}
    .tab-content.active{display:block}

    /* CARD */
    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:1.5rem}
    .panel-title{font-family:"Cormorant Garamond",serif;font-size:1.4rem;color:var(--cream);margin-bottom:1.5rem}

    /* ORDERS */
    .order-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1rem;transition:border-color .3s}
    .order-card:hover{border-color:rgba(201,168,76,.4)}
    .order-head{display:flex;gap:1rem;align-items:center;padding:1rem 1.25rem;background:var(--bg3);flex-wrap:wrap}
    .order-num{font-family:"Cormorant Garamond",serif;font-size:1.1rem;color:var(--cream)}
    .order-date{font-size:.78rem;color:var(--muted);margin-left:auto}
    .status-badge{padding:.28rem .85rem;border-radius:30px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
    .status-pending{background:rgba(244,200,66,.12);color:#f4c842;border:1px solid rgba(244,200,66,.3)}
    .status-paid{background:rgba(111,207,151,.12);color:var(--green);border:1px solid rgba(111,207,151,.3)}
    .status-processing{background:rgba(129,161,255,.12);color:#81a1ff;border:1px solid rgba(129,161,255,.3)}
    .status-shipped{background:rgba(129,161,255,.15);color:#81a1ff;border:1px solid rgba(129,161,255,.4)}
    .status-delivered{background:rgba(111,207,151,.15);color:var(--green);border:1px solid rgba(111,207,151,.4)}
    .status-cancelled{background:rgba(224,112,112,.12);color:var(--red);border:1px solid rgba(224,112,112,.3)}
    .order-body{padding:1rem 1.25rem}
    .order-items-preview{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.85rem}
    .oi-thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:var(--bg3)}
    .oi-more{width:48px;height:48px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
    .order-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
    .order-total{font-family:"Cormorant Garamond",serif;font-size:1.3rem;color:var(--gold)}
    .btn-sm{padding:.42rem 1rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;transition:all .25s}
    .btn-sm:hover{border-color:var(--gold);color:var(--cream)}

    /* EMPTY */
    .empty-state{text-align:center;padding:3rem 1rem}
    .empty-icon{font-size:3.5rem;margin-bottom:1rem}
    .empty-title{font-family:"Cormorant Garamond",serif;font-size:1.6rem;color:var(--cream);margin-bottom:.5rem}
    .empty-sub{color:var(--muted);margin-bottom:1.5rem;font-size:.88rem}

    /* FORMS */
    .form-group{margin-bottom:1rem}
    .form-label{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
    .form-input{width:100%;padding:.8rem 1rem;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--cream);font-family:inherit;font-size:.95rem;transition:border-color .3s,box-shadow .3s}
    .form-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.1)}
    .form-input::placeholder{color:var(--muted)}
    .btn-gold{padding:.85rem 2rem;background:var(--gold);color:var(--bg);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;border-radius:6px;transition:background .3s,transform .2s;display:inline-block}
    .btn-gold:hover{background:var(--gold2);transform:translateY(-1px)}
    .btn-gold:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .alert{padding:.85rem 1rem;border-radius:8px;font-size:.88rem;margin-bottom:1rem;display:none}
    .alert.show{display:block}
    .alert.success{background:rgba(111,207,151,.12);border:1px solid rgba(111,207,151,.3);color:#6fcf97}
    .alert.error{background:rgba(224,112,112,.12);border:1px solid rgba(224,112,112,.3);color:var(--red)}

    /* Skeleton */
    .skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:80px;margin-bottom:1rem}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @keyframes fup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .profile-page{animation:fup .5s var(--ease) both}
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">LuxInteriors</a>
    <div class="nav-links">
      <a href="/">Shop</a>
      <a href="/pages/profile.html" class="active">My Account</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="profile-page">
    <div class="container">
      <div class="profile-header">
        <div class="profile-greeting" id="greeting">Welcome back ✦</div>
        <div class="profile-email" id="user-email"></div>
      </div>

      <div class="profile-grid">
        <!-- SIDEBAR -->
        <div class="sidebar">
          <div class="sidebar-item active" onclick="showTab('orders',this)"><span class="sidebar-icon">📦</span> My Orders</div>
          <div class="sidebar-divider"></div>
          <div class="sidebar-item" onclick="showTab('profile',this)"><span class="sidebar-icon">👤</span> Profile</div>
          <div class="sidebar-item" onclick="showTab('password',this)"><span class="sidebar-icon">🔒</span> Password</div>
          <div class="sidebar-divider"></div>
          <div class="sidebar-item" onclick="logout()"><span class="sidebar-icon">↩</span> Logout</div>
        </div>

        <!-- CONTENT -->
        <div>
          <!-- Orders Tab -->
          <div class="tab-content active" id="tab-orders">
            <div class="panel">
              <div class="panel-title">My Orders</div>
              <div id="orders-list"><div class="skeleton"></div><div class="skeleton"></div></div>
            </div>
          </div>

          <!-- Profile Tab -->
          <div class="tab-content" id="tab-profile">
            <div class="panel">
              <div class="panel-title">Profile Information</div>
              <div class="alert" id="profile-alert"></div>
              <form id="profile-form">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input class="form-input" type="text" id="prof-name" placeholder="Your name" />
                </div>
                <div class="form-group">
                  <label class="form-label">Email Address</label>
                  <input class="form-input" type="email" id="prof-email" disabled style="opacity:.6" />
                </div>
                <div class="form-group">
                  <label class="form-label">Member Since</label>
                  <input class="form-input" type="text" id="prof-since" disabled style="opacity:.6" />
                </div>
                <button type="submit" class="btn-gold" id="profile-btn">Save Changes</button>
              </form>
            </div>
          </div>

          <!-- Password Tab -->
          <div class="tab-content" id="tab-password">
            <div class="panel">
              <div class="panel-title">Change Password</div>
              <div class="alert" id="pw-alert"></div>
              <form id="pw-form">
                <div class="form-group">
                  <label class="form-label">Current Password</label>
                  <input class="form-input" type="password" id="cur-pw" placeholder="••••••••" />
                </div>
                <div class="form-group">
                  <label class="form-label">New Password</label>
                  <input class="form-input" type="password" id="new-pw" placeholder="Min. 8 characters" />
                </div>
                <div class="form-group">
                  <label class="form-label">Confirm New Password</label>
                  <input class="form-input" type="password" id="confirm-pw" placeholder="Repeat new password" />
                </div>
                <button type="submit" class="btn-gold" id="pw-btn">Update Password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("lux_token");
    const user  = JSON.parse(localStorage.getItem("lux_user") || "null");

    if (!token) window.location.href = "/pages/login.html?redirect=/pages/profile.html";

    // ── Setup user info ────────────────────────────────────
    if (user) {
      document.getElementById("greeting").textContent = `Welcome back, ${user.name} ✦`;
      document.getElementById("user-email").textContent = user.email;
      document.getElementById("prof-name").value = user.name || "";
      document.getElementById("prof-email").value = user.email || "";
    }

    // Fetch fresh user data
    fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token } })
      .then(r => r.json()).then(d => {
        if (d.success) {
          const u = d.user;
          document.getElementById("greeting").textContent = `Welcome back, ${u.name} ✦`;
          document.getElementById("user-email").textContent = u.email;
          document.getElementById("prof-name").value = u.name;
          document.getElementById("prof-email").value = u.email;
          document.getElementById("prof-since").value = new Date(u.created_at).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
        }
      }).catch(() => {});

    // ── Tab switching ──────────────────────────────────────
    function showTab(name, el) {
      document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".sidebar-item").forEach(s => s.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      if (el) el.classList.add("active");
      if (name === "orders") loadOrders();
    }

    // ── Load orders ────────────────────────────────────────
    async function loadOrders() {
      try {
        const res = await fetch("/api/orders", { headers: { Authorization: "Bearer " + token } });
        const data = await res.json();
        const container = document.getElementById("orders-list");

        if (!data.data?.length) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📦</div>
              <div class="empty-title">No orders yet</div>
              <div class="empty-sub">Your completed orders will appear here.</div>
              <a href="/" class="btn-gold" style="text-decoration:none">Start Shopping</a>
            </div>`;
          return;
        }

        container.innerHTML = data.data.map(order => {
          const items = tryParse(order.items) || [];
          const thumbs = items.slice(0,3).map(i => `<img class="oi-thumb" src="${i.img||''}" alt="${i.name||''}" onerror="this.style.display='none'" />`).join("");
          const extra = items.length > 3 ? `<div class="oi-more">+${items.length-3}</div>` : "";
          const statusClass = "status-" + (order.status || "pending");
          return `
            <div class="order-card">
              <div class="order-head">
                <div class="order-num">Order #${order.id}</div>
                <span class="status-badge ${statusClass}">${order.status}</span>
                <div class="order-date">${new Date(order.created_at).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"})}</div>
              </div>
              <div class="order-body">
                <div class="order-items-preview">${thumbs}${extra}</div>
                <div class="order-foot">
                  <div style="font-size:.82rem;color:var(--muted)">${items.length} item${items.length!==1?"s":""} · Shipped to ${order.shipping_city||"—"}, ${order.shipping_country||""}</div>
                  <div class="order-total">$${parseFloat(order.total).toLocaleString("en-US",{minimumFractionDigits:2})}</div>
                </div>
              </div>
            </div>`;
        }).join("");
      } catch (err) {
        document.getElementById("orders-list").innerHTML = `<div style="color:var(--red);font-size:.88rem">Failed to load orders.</div>`;
      }
    }

    function tryParse(val) { try { return typeof val === "string" ? JSON.parse(val) : val; } catch { return null; } }

    // ── Profile form ───────────────────────────────────────
    document.getElementById("profile-form").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("profile-btn");
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/me", {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ name: document.getElementById("prof-name").value.trim() })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        showAlert("profile-alert", data.message, "success");
        localStorage.setItem("lux_user", JSON.stringify(data.user));
      } catch (err) {
        showAlert("profile-alert", err.message, "error");
      } finally { btn.disabled = false; }
    });

    // ── Password form ──────────────────────────────────────
    document.getElementById("pw-form").addEventListener("submit", async e => {
      e.preventDefault();
      const cur = document.getElementById("cur-pw").value;
      const nw  = document.getElementById("new-pw").value;
      const cnf = document.getElementById("confirm-pw").value;
      if (nw !== cnf) return showAlert("pw-alert", "Passwords do not match.", "error");
      if (nw.length < 8) return showAlert("pw-alert", "Password must be at least 8 characters.", "error");
      const btn = document.getElementById("pw-btn");
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/me", {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ currentPassword: cur, newPassword: nw })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        showAlert("pw-alert", "Password updated successfully ✦", "success");
        document.getElementById("pw-form").reset();
      } catch (err) {
        showAlert("pw-alert", err.message, "error");
      } finally { btn.disabled = false; }
    });

    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = "alert " + type + " show";
      setTimeout(() => el.classList.remove("show"), 5000);
    }

    function logout() {
      localStorage.removeItem("lux_token");
      localStorage.removeItem("lux_user");
      window.location.href = "/";
    }

    loadOrders();
  </script>
</body>
</html>
